# Alembic de Nexora. La URL NO va aquí: se lee de DATABASE_URL (.env) en migraciones/env.py.
# Uso (desde la carpeta del proyecto):
#   alembic -c backend/alembic.ini current
#   alembic -c backend/alembic.ini stamp head      <- base que ya tiene las tablas (NO las recrea ni las borra)
#   alembic -c backend/alembic.ini upgrade head    <- solo en una base vacía (crea las 5 tablas)

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
